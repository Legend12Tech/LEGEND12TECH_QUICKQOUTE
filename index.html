<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Legend12Tech QuickQuote</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fa;
  color: #17202a;
}

.container {
  max-width: 650px;
  margin: 30px auto;
  padding: 20px;
}

/* BRANDING */

.brand {
  text-align: center;
  margin-bottom: 10px;
}

.logo-icon {
  width: 70px;
  height: 70px;
  margin: 0 auto 12px;
  border-radius: 18px;
  background: linear-gradient(135deg, #0b1f4d, #1677ff);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  font-weight: bold;
  box-shadow: 0 8px 20px rgba(22,119,255,0.25);
}

.brand-name {
  font-size: 30px;
  font-weight: bold;
  color: #0b1f4d;
}

.brand-name span {
  color: #1677ff;
}

.quickquote {
  font-size: 25px;
  font-weight: bold;
  margin-top: 3px;
  color: #17202a;
}

.quickquote span {
  color: #1677ff;
}

.tagline {
  color: #6b7280;
  margin-top: 8px;
  margin-bottom: 28px;
}

.form-box,
.quote-box {
  background: white;
  padding: 25px;
  border-radius: 12px;
  margin-bottom: 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input,
textarea,
select {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  font-size: 16px;
}

textarea {
  min-height: 100px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  border: none;
  border-radius: 7px;
  font-size: 16px;
  font-weight: bold;
}

.generate-btn {
  background: #111827;
  color: white;
}

.pdf-btn {
  background: #2563eb;
  color: white;
}

.whatsapp-btn {
  background: #25D366;
  color: white;
}

.quote-header {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 2px solid #e5e7eb;
  padding-bottom: 18px;
  margin-bottom: 20px;
}

.quote-title {
  font-size: 28px;
  font-weight: bold;
}

.business-contact {
  margin-top: 10px;
  line-height: 1.8;
  color: #4b5563;
}

.info {
  margin: 12px 0;
}

.description {
  background: #f9fafb;
  padding: 15px;
  border-radius: 8px;
  margin-top: 20px;
}

.total {
  margin-top: 25px;
  padding-top: 20px;
  border-top: 2px solid #e5e7eb;
  text-align: right;
  font-size: 24px;
  font-weight: bold;
}

.footer {
  text-align: center;
  color: #6b7280;
  margin-top: 25px;
  font-size: 13px;
}

</style>
</head>

<body>

<div class="container">

<!-- BRAND -->

<div class="brand">

<div class="logo-icon">
Q✓
</div>

<div class="brand-name">
Legend12<span>Tech</span>
</div>

<div class="quickquote">
Quick<span>Quote</span>
</div>

<div class="tagline">
Create professional quotations in minutes.
</div>

</div>


<!-- FORM -->

<div class="form-box">

<label>Business Name</label>
<input id="business" type="text"
placeholder="e.g. Legend Web Design">

<label>Business Phone</label>
<input id="phone" type="tel"
placeholder="e.g. +234 706 130 3234">

<label>Business Address</label>
<input id="address" type="text"
placeholder="e.g. Abuja, Nigeria">

<label>Customer Name</label>
<input id="customer" type="text"
placeholder="e.g. John Smith">

<label>Customer Email</label>
<input id="email" type="email"
placeholder="e.g. john@example.com">

<label>Service / Project</label>
<input id="service" type="text"
placeholder="e.g. Restaurant Website">

<label>Description</label>
<textarea id="description"
placeholder="Describe the project or service"></textarea>

<label>Price</label>
<input id="price" type="number"
placeholder="e.g. 300">

<label>Currency</label>

<select id="currency">

<option value="$">USD ($)</option>
<option value="£">GBP (£)</option>
<option value="€">EUR (€)</option>
<option value="₦">NGN (₦)</option>

</select>

<label>Delivery Time</label>

<input id="delivery" type="text"
placeholder="e.g. 7 days">

<button
class="generate-btn"
onclick="generateQuote()">

GENERATE QUOTE

</button>

</div>


<!-- QUOTE -->

<div class="quote-box">

<div class="quote-header">

<div>

<div class="quote-title">
QUOTATION
</div>

<div id="qBusiness">
Your Business
</div>

<div class="business-contact">

<div>
📞 <strong>Phone:</strong>
<span id="qPhone"></span>
</div>

<div>
📍 <strong>Address:</strong>
<span id="qAddress"></span>
</div>

</div>

</div>


<div>

Quote No:
<span id="qNumber"></span>

<br>

Date:
<span id="qDate"></span>

</div>

</div>


<div class="info">

<strong>Customer:</strong>
<span id="qCustomer"></span>

</div>


<div class="info">

<strong>Email:</strong>
<span id="qEmail"></span>

</div>


<div class="info">

<strong>Project:</strong>
<span id="qService"></span>

</div>


<div class="info">

<strong>Delivery:</strong>
<span id="qDelivery"></span>

</div>


<div class="description">

<strong>Description</strong>

<p id="qDescription"></p>

</div>


<div class="total">

Total:

<span id="qCurrency">$</span>

<span id="qPrice">0</span>

</div>


<button
class="pdf-btn"
onclick="downloadPDF()">

DOWNLOAD PDF

</button>


<button
class="whatsapp-btn"
onclick="shareWhatsApp()">

📲 SHARE ON WHATSAPP

</button>


<div class="footer">

Thank you for your business.

<br>

Powered by Legend12Tech QuickQuote

</div>

</div>

</div>


<script>

function generateQuote() {

document.getElementById("qBusiness").textContent =
document.getElementById("business").value;

document.getElementById("qPhone").textContent =
document.getElementById("phone").value;

document.getElementById("qAddress").textContent =
document.getElementById("address").value;

document.getElementById("qCustomer").textContent =
document.getElementById("customer").value;

document.getElementById("qEmail").textContent =
document.getElementById("email").value;

document.getElementById("qService").textContent =
document.getElementById("service").value;

document.getElementById("qDescription").textContent =
document.getElementById("description").value;

document.getElementById("qPrice").textContent =
document.getElementById("price").value;

document.getElementById("qCurrency").textContent =
document.getElementById("currency").value;

document.getElementById("qDelivery").textContent =
document.getElementById("delivery").value;

document.getElementById("qNumber").textContent =
"Q-" + Math.floor(1000 + Math.random() * 9000);

document.getElementById("qDate").textContent =
new Date().toLocaleDateString();

}


function downloadPDF() {

var business =
document.getElementById("business").value;

var phone =
document.getElementById("phone").value;

var address =
document.getElementById("address").value;

var customer =
document.getElementById("customer").value;

var email =
document.getElementById("email").value;

var service =
document.getElementById("service").value;

var description =
document.getElementById("description").value;

var price =
document.getElementById("price").value;

var currency =
document.getElementById("currency").value;

var delivery =
document.getElementById("delivery").value;

var quoteNumber =
document.getElementById("qNumber").textContent;

var date =
document.getElementById("qDate").textContent;


var pdfWindow = window.open("", "_blank");


pdfWindow.document.write(`

<!DOCTYPE html>

<html>

<head>

<title>Quotation ${quoteNumber}</title>

<style>

body {
font-family: Arial, sans-serif;
padding: 40px;
color: #17202a;
}

.page {
max-width: 800px;
margin: auto;
}

.header {
display: flex;
justify-content: space-between;
border-bottom: 2px solid #222;
padding-bottom: 20px;
margin-bottom: 25px;
}

.title {
font-size: 32px;
font-weight: bold;
}

.business {
font-size: 22px;
font-weight: bold;
margin-top: 8px;
}

.contact {
margin-top: 10px;
line-height: 1.8;
}

.meta {
text-align: right;
line-height: 1.8;
}

.row {
margin: 14px 0;
font-size: 16px;
}

.description {
margin-top: 25px;
padding: 18px;
background: #f4f4f4;
border-radius: 8px;
}

.total {
margin-top: 30px;
padding-top: 20px;
border-top: 2px solid #222;
text-align: right;
font-size: 28px;
font-weight: bold;
}

.footer {
margin-top: 50px;
text-align: center;
font-size: 13px;
color: #666;
}

</style>

</head>

<body>

<div class="page">

<div class="header">

<div>

<div class="title">
QUOTATION
</div>

<div class="business">
${business}
</div>

<div class="contact">

📞 Phone: ${phone}

<br>

📍 Address: ${address}

</div>

</div>


<div class="meta">

Quote No: ${quoteNumber}

<br>

Date: ${date}

</div>

</div>


<div class="row">
<strong>Customer:</strong>
${customer}
</div>


<div class="row">
<strong>Email:</strong>
${email}
</div>


<div class="row">
<strong>Project:</strong>
${service}
</div>


<div class="row">
<strong>Delivery:</strong>
${delivery}
</div>


<div class="description">

<strong>Description</strong>

<p>
${description}
</p>

</div>


<div class="total">

Total:
${currency}${price}

</div>


<div class="footer">

Thank you for your business.

<br>

Powered by Legend12Tech QuickQuote

</div>

</div>

</body>

</html>

`);

pdfWindow.document.close();

pdfWindow.focus();

setTimeout(function() {

pdfWindow.print();

}, 500);

}


function shareWhatsApp() {

var business =
document.getElementById("business").value;

var phone =
document.getElementById("phone").value;

var address =
document.getElementById("address").value;

var customer =
document.getElementById("customer").value;

var email =
document.getElementById("email").value;

var service =
document.getElementById("service").value;

var description =
document.getElementById("description").value;

var price =
document.getElementById("price").value;

var currency =
document.getElementById("currency").value;

var delivery =
document.getElementById("delivery").value;

var quoteNumber =
document.getElementById("qNumber").textContent;

var date =
document.getElementById("qDate").textContent;


var message =
"QUOTATION%0A%0A" +

"Business: " + encodeURIComponent(business) + "%0A" +

"Phone: " + encodeURIComponent(phone) + "%0A" +

"Address: " + encodeURIComponent(address) + "%0A%0A" +

"Quote No: " + encodeURIComponent(quoteNumber) + "%0A" +

"Date: " + encodeURIComponent(date) + "%0A%0A" +

"Customer: " + encodeURIComponent(customer) + "%0A" +

"Email: " + encodeURIComponent(email) + "%0A" +

"Project: " + encodeURIComponent(service) + "%0A" +

"Delivery: " + encodeURIComponent(delivery) + "%0A%0A" +

"Description: " + encodeURIComponent(description) + "%0A%0A" +

"Total: " + encodeURIComponent(currency + price) + "%0A%0A" +

"Thank you for your business.%0A%0A" +

"Powered by Legend12Tech QuickQuote";


var whatsappURL =
"https://wa.me/?text=" + message;


window.open(whatsappURL, "_blank");

}

</script>

</body>
</html>
