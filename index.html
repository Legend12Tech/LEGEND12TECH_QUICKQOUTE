<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Legend12Tech QuickQuote</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fa;
  color: #17202a;
}

.container {
  max-width: 650px;
  margin: 30px auto;
  padding: 20px;
}

h1 {
  text-align: center;
  color: #111827;
}

.subtitle {
  text-align: center;
  color: #6b7280;
  margin-bottom: 25px;
}

.form-box,
.quote-box {
  background: white;
  padding: 25px;
  border-radius: 12px;
  margin-bottom: 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input,
textarea,
select {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 7px;
  font-size: 16px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.generate-btn,
.pdf-btn {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  border: none;
  border-radius: 7px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.generate-btn {
  background: #111827;
  color: white;
}

.pdf-btn {
  background: #2563eb;
  color: white;
}

.quote-header {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  border-bottom: 2px solid #e5e7eb;
  padding-bottom: 15px;
  margin-bottom: 20px;
}

.quote-title {
  font-size: 28px;
  font-weight: bold;
}

.quote-number {
  text-align: right;
  color: #6b7280;
  font-size: 14px;
}

.info {
  margin: 12px 0;
}

.description {
  background: #f9fafb;
  padding: 15px;
  border-radius: 8px;
  margin-top: 20px;
}

.total {
  margin-top: 25px;
  padding-top: 20px;
  border-top: 2px solid #e5e7eb;
  text-align: right;
  font-size: 24px;
  font-weight: bold;
}

.footer {
  text-align: center;
  color: #6b7280;
  margin-top: 25px;
  font-size: 13px;
}

@media print {
  body {
    background: white;
  }

  .form-box,
  h1,
  .subtitle {
    display: none;
  }

  .container {
    margin: 0;
    max-width: 100%;
  }

  .quote-box {
    box-shadow: none;
  }

  .pdf-btn {
    display: none;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>Legend12Tech QuickQuote</h1>

<p class="subtitle">
Create professional quotations in minutes.
</p>

<div class="form-box">

<label>Business Name</label>
<input id="business" type="text" placeholder="e.g. Legend Web Design">

<label>Customer Name</label>
<input id="customer" type="text" placeholder="e.g. John Smith">

<label>Customer Email</label>
<input id="email" type="email" placeholder="e.g. john@example.com">

<label>Service / Project</label>
<input id="service" type="text" placeholder="e.g. Restaurant Website">

<label>Description</label>
<textarea id="description" placeholder="Describe the project or service"></textarea>

<label>Price</label>
<input id="price" type="number" placeholder="e.g. 300">

<label>Currency</label>
<select id="currency">
  <option value="$">USD ($)</option>
  <option value="£">GBP (£)</option>
  <option value="€">EUR (€)</option>
  <option value="₦">NGN (₦)</option>
</select>

<label>Delivery Time</label>
<input id="delivery" type="text" placeholder="e.g. 7 days">

<button class="generate-btn" onclick="generateQuote()">
  GENERATE QUOTE
</button>

</div>


<div class="quote-box" id="quote">

  <div class="quote-header">

    <div>
      <div class="quote-title">QUOTATION</div>
      <div id="qBusiness">Your Business</div>
    </div>

    <div class="quote-number">
      Quote No: <span id="qNumber"></span><br>
      Date: <span id="qDate"></span>
    </div>

  </div>

  <div class="info">
    <strong>Customer:</strong>
    <span id="qCustomer"></span>
  </div>

  <div class="info">
    <strong>Email:</strong>
    <span id="qEmail"></span>
  </div>

  <div class="info">
    <strong>Project:</strong>
    <span id="qService"></span>
  </div>

  <div class="info">
    <strong>Delivery:</strong>
    <span id="qDelivery"></span>
  </div>

  <div class="description">
    <strong>Description</strong>
    <p id="qDescription"></p>
  </div>

  <div class="total">
    Total:
    <span id="qCurrency">$</span><span id="qPrice">0</span>
  </div>

  <button class="pdf-btn" onclick="downloadPDF()">
    DOWNLOAD PDF
  </button>

  <div class="footer">
    Thank you for your business.<br>
    Powered by Legend12Tech QuickQuote
  </div>

</div>

</div>


<script>

function generateQuote() {

  document.getElementById("qBusiness").textContent =
    document.getElementById("business").value;

  document.getElementById("qCustomer").textContent =
    document.getElementById("customer").value;

  document.getElementById("qEmail").textContent =
    document.getElementById("email").value;

  document.getElementById("qService").textContent =
    document.getElementById("service").value;

  document.getElementById("qDescription").textContent =
    document.getElementById("description").value;

  document.getElementById("qPrice").textContent =
    document.getElementById("price").value;

  document.getElementById("qCurrency").textContent =
    document.getElementById("currency").value;

  document.getElementById("qDelivery").textContent =
    document.getElementById("delivery").value;

  document.getElementById("qNumber").textContent =
    "Q-" + Math.floor(1000 + Math.random() * 9000);

  document.getElementById("qDate").textContent =
    new Date().toLocaleDateString();

}

function downloadPDF() {
  window.print();
}

</script>

</body>
</html>
